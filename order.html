<!DOCTYPE html>
<html lang="en">
<head>
    <title>LocalKart - Order</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>LocalKart</h1>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart</a>
    </nav>

    <h2>Place Your Order</h2>

    <form class="order-form" action="success.html">

        <label>Full Name</label>
        <input type="text" required>

        <label>Select Product</label>
        <select required>
            <option>Fresh Apples</option>
            <option>Sports Shoes</option>
            <option>Classic Watch</option>
            <option>College Bag</option>
        </select>

        <label>Quantity</label>
        <input type="number" min="1" required>

        <label>Phone Number</label>
        <input type="tel" required>

        <label>Delivery Address</label>
        <textarea required></textarea>

        <button class="btn" type="submit">
            Place Order
        </button>

    </form>

    <footer>© 2026 LocalKart</footer>

</body>
</html>
