<!DOCTYPE html>
<html lang="en">
<head>
    <title>LocalKart - Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>LocalKart Admin</h1>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="vendor.html">Vendor</a>
        <a href="admin.html">Admin</a>
    </nav>

    <h2>Admin Dashboard</h2>

    <div class="dashboard">

        <div class="dashboard-card">
            <h3>Total Products</h3>
            <h1>4</h1>
        </div>

        <div class="dashboard-card">
            <h3>Total Vendors</h3>
            <h1>3</h1>
        </div>

        <div class="dashboard-card">
            <h3>Total Orders</h3>
            <h1>12</h1>
        </div>

    </div>

    <div class="cart">
        <h2>Inventory Management</h2>

        <table>
            <tr>
                <th>Product</th>
                <th>Stock</th>
                <th>Status</th>
            </tr>

            <tr>
                <td>Fresh Apples</td>
                <td>50 kg</td>
                <td>Available</td>
            </tr>

            <tr>
                <td>Sports Shoes</td>
                <td>20</td>
                <td>Available</td>
            </tr>

            <tr>
                <td>Classic Watch</td>
                <td>15</td>
                <td>Available</td>
            </tr>

            <tr>
                <td>College Bag</td>
                <td>5</td>
                <td>Low Stock</td>
            </tr>
        </table>

        <a href="products.html" class="btn">
            View Products
        </a>

    </div>

    <footer>© 2026 LocalKart</footer>

</body>
</html>
